# Upstream provenance for every spec in openapi_specs/.
#
# Specs in this repository are copies of files their services publish. This
# records where each came from, so a refresh is an overwrite rather than a
# merge and a drift check has something to compare against.
#
# Every OSDU service publishes at docs/api/community/v{N}/openapi.{yaml,json}
# on community.opengroup.org, served anonymously over plain HTTPS -- which is
# why the drift check needs no credentials and no deployed environment. Those
# published files are themselves gated by each service's own
# `cimpl-check-openapi-spec` job, which fails that service's pipeline when the
# committed spec no longer matches the running service. Comparing against them
# inherits that guarantee.
#
# Fields
#   service          key used below; matches the spec filename stem
#   spec             path to the file, relative to openapi_specs/
#   project          GitLab project path
#   path             file path within that project
#   ref              branch or commit the hash was taken from
#   url              raw download URL
#   state            identical -> our copy matches upstream byte for byte
#                    differs   -> it does not, for the reason in `note`
#   upstream_sha256  sha256 of the upstream file when last verified
#   local_sha256     sha256 of our copy at that time
#   verified         date of the last comparison
#
# Every entry should read `state: identical`. `differs` exists so a drift check
# can tell a known divergence from a new one, but it is a holding position, not
# a destination -- a spec that cannot be matched to a published file has no
# provenance to check against. Do not resolve a `differs` entry by editing the
# spec: refresh it from `url`, and put any local correction in generate_all.py's
# patch step (see docs/development.md).

version: 1
verified: "2026-08-22"

