name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    permissions:
      contents: write # Required to update changelog file
      pull-requests: write # Required to create release PRs
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@2bcfd866433034d2106755d203635aeed68b6f6f # v9.40.0

  test:
    name: Test
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/run-tests.yml

  build-and-publish:
    name: Build and publish
    needs: [release-please, test]
    # needs.test must have succeeded — never publish a package whose tests did not pass.
    if: ${{ always() && needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to read the repository contents
      packages: write # Required to publish packages to GitHub Packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.x"

      - name: Install Kiota
        run: dotnet tool install --global Microsoft.OpenApi.Kiota

      - name: Generate C# clients
        run: python generate_all.py

      - name: Build
        run: dotnet build src/OsduCsharpClient/OsduCsharpClient.csproj --configuration Release

      - name: Pack
        run: dotnet pack src/OsduCsharpClient/OsduCsharpClient.csproj --configuration Release --no-build --output nupkgs

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push nupkgs/*.nupkg \
            --source "https://nuget.pkg.github.com/equinor/index.json" \
            --api-key "${GITHUB_TOKEN}" \
            --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
