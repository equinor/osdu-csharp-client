name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    permissions:
      contents: write # Required to update changelog file
      pull-requests: write # Required to create release PRs
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@9f888bd4522bcfaf0cce912c78507079dcd0fc27 # v9.44.1

  test:
    name: Test
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/run-tests.yml

  build-and-publish:
    name: Build and publish
    needs: [release-please, test]
    # needs.test must have succeeded — never publish a package whose tests did not pass.
    if: ${{ always() && needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to read the repository contents
      packages: write # Required to publish packages to GitHub Packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.x"

      - name: Restore pinned Kiota
        run: dotnet tool restore

      - name: Generate C# clients
        run: python generate_all.py

      - name: Build
        run: dotnet build src/OsduCsharpClient.Msal/OsduCsharpClient.Msal.csproj --configuration Release

      - name: Pack
        run: |
          dotnet pack src/OsduCsharpClient/OsduCsharpClient.csproj --configuration Release --no-build --output nupkgs
          dotnet pack src/OsduCsharpClient.Msal/OsduCsharpClient.Msal.csproj --configuration Release --no-build --output nupkgs

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push nupkgs/*.nupkg \
            --source "https://nuget.pkg.github.com/equinor/index.json" \
            --api-key "${GITHUB_TOKEN}" \
            --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
